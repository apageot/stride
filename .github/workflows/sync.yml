name: Synchro Garmin

on:
  schedule:
    - cron: "23 5-21/3 * * *"   # toutes les 3 h de 6 h à 22 h (heure de Paris en hiver)
  workflow_dispatch:
    inputs:
      seance:
        description: "Séance à envoyer tout de suite sur la montre (id)"
        required: false
        default: ""
      ressenti:
        description: "Ressenti après une séance (id=facile|ok|dur)"
        required: false
        default: ""
      date_course:
        description: "Mode : date de course AAAA-MM-JJ, ou « aucune » pour objectif seul"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Les jetons Garmin se rafraîchissent : on garde la dernière version d'une synchro à l'autre
      - uses: actions/cache@v4
        with:
          path: ~/.garminconnect
          key: garmin-tokens-${{ github.run_id }}
          restore-keys: garmin-tokens-

      - name: Synchro
        env:
          GARMIN_TOKENS_JSON: ${{ secrets.GARMIN_TOKENS_JSON }}
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          SEANCE: ${{ github.event.inputs.seance }}
          RESSENTI: ${{ github.event.inputs.ressenti }}
          DATE_COURSE: ${{ github.event.inputs.date_course }}
        run: python -m engine.sync

      - name: Enregistrer
        run: |
          git config user.name "stride-bot"
          git config user.email "stride-bot@users.noreply.github.com"
          git add docs/data.json state/
          git diff --cached --quiet || git commit -m "Synchro $(date +'%d/%m %H:%M')"
          git push
